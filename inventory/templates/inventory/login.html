{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stockify</title>
    
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <a href="{% url 'contact' %}" class="btn-help">
        Need Help <i class="fa-solid fa-circle-question"></i>
    </a>

    <div class="container">
        <div class="header">
            <img src="{% static 'images/cube-logo.png' %}" alt="Stockify Logo" class="logo-img">
            <h1>Stockify</h1>
            <p>Welcome back to your inventory control center</p>
        </div>

        <div class="card">
            
            {% if messages %}
                {% for message in messages %}
                    <div style="color: #dc2626; background-color: #fef2f2; border: 1px solid #f87171; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: center; font-weight: 500;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="username" placeholder="Enter your username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" id="pwd" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePwd"></i>
                    </div>
                </div>
                
                <div class="forgot-password">
                    <a href="{% url 'forgot_password' %}">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>
            
            <div class="card-footer">
                <p>Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
            </div>
        </div>
    </div>

    <script>
        // Push the current state to the browser history
        window.history.pushState(null, null, window.location.href);
        
        // Listen for the user clicking the browser's Back button
        window.addEventListener('popstate', function(event) {
            // Redirect them to the landing page instead of the previous page
            window.location.href = "{% url 'landing_page' %}"; 
        });

        // --- NEW: TOGGLE PASSWORD VISIBILITY ---
        const pwdInput = document.getElementById('pwd');
        const toggleIcon = document.getElementById('togglePwd');

        toggleIcon.addEventListener('click', function() {
            // Switch between password and text
            const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
            pwdInput.setAttribute('type', type);
            
            // Toggle the eye / eye-slash classes
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>

</body>
</html>
