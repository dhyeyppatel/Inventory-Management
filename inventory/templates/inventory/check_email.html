{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stockify - Check Your Email</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="{% static 'css/check_email.css' %}">
</head>
<body>

<div class="navbar">
<a href="{% url 'landing_page' %}" class="logo">
<img src="{% static 'images/cube-logo.png' %}" alt="Stockify Logo">
Stockify
</a>
<a href="{% url 'contact' %}" class="help-btn">Need Help <i class="fa-solid fa-circle-question"></i></a>
</div>

<div class="success-card">
<div class="icon-circle">
<i class="fa-solid fa-envelope-open-text main-icon"></i>
<i class="fa-solid fa-circle-check check-icon"></i>
</div>

<h2>Check your email</h2>

<p>We've sent a password reset link to


<span class="email-display">{{ dynamic_email }}</span></p>

<hr>

<p class="resend-text">Didn't receive the email? Check your spam folder or


<a href="#">click to resend</a>.</p>

<a href="{% url 'login' %}" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>

</div>

</body>
</html>
