{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Stockify</title>
    
    <link rel="stylesheet" href="{% static 'css/register.css' %}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <a href="/contact/" class="btn-help">
        Need Help <i class="fa-solid fa-circle-question"></i>
    </a>

    <div class="container">
        <div class="header">
            <img src="{% static 'images/cube-logo.png' %}" alt="Stockify Logo" class="logo-img">
            <h1>Stockify</h1>
            <p>Create a new account to get started</p>
        </div>

        <div class="card">
            <form method="POST" action="">
                {% csrf_token %}
                
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" name="username" placeholder="Choose a username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Business Entity Name</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-building"></i>
                        <input type="text" name="business_name" placeholder="Acme Corp Pvt. Ltd." required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="confirm_password" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Register</button>
            </form>
            
            <div class="card-footer">
                <p>Already have an account? <a href="/login/">Login</a></p>
            </div>
        </div>
    </div>

</body>
</html>
